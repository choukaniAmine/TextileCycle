services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: textilecycle:latest
    container_name: textilecycle_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "ReFashion"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY:-base64:0FHtwAyEs/WYYtq6xvlGD3g16XVmZ564EJZnmIUoBcI=}"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: textilecycle
      DB_USERNAME: root
      DB_PASSWORD: ""
      SESSION_DRIVER: database
      CACHE_STORE: database

      # Services IA & Machine Learning (lus depuis votre .env local)
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      GEMINI_FALLBACK_MODEL: "${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash}"
      ML_SERVICE_URL: "${ML_SERVICE_URL:-https://estimation0heure.vercel.app/}"
      ML_PYTHON_BIN: "${ML_PYTHON_BIN:-python}"
      XAI_API_KEY: "${XAI_API_KEY}"
      XAI_BASE_URL: "${XAI_BASE_URL:-https://api.groq.com/openai/v1}"
      XAI_MODEL: "${XAI_MODEL:-openai/gpt-oss-120b}"
      XAI_TIMEOUT: "${XAI_TIMEOUT:-60}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - textilecycle_network

  mysql:
    image: mysql:8.0
    container_name: textilecycle_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: textilecycle
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - textilecycle_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: textilecycle_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - textilecycle_network

volumes:
  mysql_data:
    driver: local

networks:
  textilecycle_network:
    driver: bridge
