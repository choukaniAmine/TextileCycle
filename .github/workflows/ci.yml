name: CI Pipeline

on:
  push:
    branches:
      - final_integration_v1
  pull_request:
    branches:
      - final_integration_v1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

jobs:
  # ========================================================
  # 1. ANALYSE STATIQUE DE CODE AVEC PHPSTAN / LARASTAN
  # ========================================================
  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, gd, curl, zip
          coverage: none

      - name: Mise en cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Installer les dépendances Composer
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Exécuter PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  # ========================================================
  # 2. TESTS AUTOMATISÉS (PHPUNIT) ET BUILD FRONTEND (VITE)
  # ========================================================
  tests:
    name: Tests & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: textilecycle_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: textilecycle_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      XAI_API_KEY: ci-dummy-key
      ML_SERVICE_URL: http://127.0.0.1:8001

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, gd, curl, zip
          coverage: none

      - name: Mise en cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.3-

      - name: Installer les dépendances Composer
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparer Laravel
        run: |
          mkdir -p storage/framework/{cache,sessions,views} bootstrap/cache
          php artisan config:clear

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances npm & compiler les assets
        run: |
          npm ci
          npm run build

      - name: Exécuter les tests automatisés
        run: php artisan test --compact
