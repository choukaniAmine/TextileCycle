name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - final_integration_v1
  workflow_dispatch: # Permet aussi de déclencher le déploiement manuellement si besoin

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ========================================================
  # DÉPLOIEMENT : BUILD DOCKER & DÉPLOIEMENT SUR AZURE AKS
  # ========================================================
  deploy:
    name: Build Docker & Deploy to AKS
    runs-on: ubuntu-latest
    # Ne se lance que si la CI a réussi (ou déclenchement manuel)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          # Récupère le commit exact qui a déclenché la CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/textilecycle:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/textilecycle:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configuration de la connexion Kubernetes (AKS)
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Déploiement des manifests sur Kubernetes
        run: |
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/mysql.yaml
          kubectl apply -f k8s/app.yaml

      - name: Redémarrage du déploiement avec la nouvelle image
        run: |
          kubectl rollout restart deployment/textilecycle-app
          kubectl rollout status deployment/textilecycle-app --timeout=180s

      - name: Exécuter les migrations en base de données
        run: |
          kubectl exec deployment/textilecycle-app -- php artisan migrate --force
