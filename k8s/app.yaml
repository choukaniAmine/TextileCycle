apiVersion: apps/v1
kind: Deployment
metadata:
  name: textilecycle-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: textilecycle
  template:
    metadata:
      labels:
        app: textilecycle
    spec:
      containers:
        - name: app
          image: arwa2004/textilecycle:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_NAME
              value: "ReFashion"
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: textilecycle-secret
                  key: APP_KEY
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "textilecycle"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: textilecycle-secret
                  key: DB_PASSWORD
            - name: SESSION_DRIVER
              value: "database"
            - name: CACHE_STORE
              value: "database"
            - name: MAIL_MAILER
              value: "smtp"
            - name: MAIL_HOST
              value: "smtp.gmail.com"
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_USERNAME
              value: "arwabenamar2004@gmail.com"
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: textilecycle-secret
                  key: MAIL_PASSWORD
            - name: MAIL_ENCRYPTION
              value: "tls"

            # ==============================
            # SERVICES IA & MACHINE LEARNING
            # ==============================
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: textilecycle-secret
                  key: GEMINI_API_KEY
            - name: GEMINI_MODEL
              value: "gemini-3.5-flash-lite"
            - name: GEMINI_FALLBACK_MODEL
              value: "gemini-3.5-flash"

            - name: ML_SERVICE_URL
              value: "https://estimation0heure.vercel.app/"
            - name: ML_PYTHON_BIN
              value: "python"

            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: textilecycle-secret
                  key: XAI_API_KEY
            - name: XAI_BASE_URL
              value: "https://api.groq.com/openai/v1"
            - name: XAI_MODEL
              value: "openai/gpt-oss-120b"
            - name: XAI_TIMEOUT
              value: "60"
---
apiVersion: v1
kind: Service
metadata:
  name: textilecycle-service
spec:
  selector:
    app: textilecycle
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
